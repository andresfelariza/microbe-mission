<style>body{background:radial-gradient(circle at 80% 0%,#0f3b3a,#04101a 70%);color:#e6fffb}.card{background:#ffffff0d;border:1px solid #5eead433}

<body><div class="wrap"><h1>🦠🛰️ Microbe Mission</h1><div id="ctl" class="card small"></div><div id="app"></div></div>
<script src="tracker.js"></script><script src="quest-engine.js"></script><script>
const MC=o=>Object.assign({type:'mc'},o),NUM=o=>Object.assign({type:'num'},o),STEPS=o=>Object.assign({type:'steps'},o),TAP=o=>Object.assign({type:'tap'},o);
const MOVE=(eq,opts,a,res,why,q)=>({eq,opts,a,res,why,q});
const NUC=['🟢 Has a nucleus','⚪ Has NO nucleus'];
const CUBES=`<svg class="fig" viewBox="0 0 300 110" width="300">
<rect class="f" x="10" y="70" width="20" height="20"/><text x="8" y="105">1</text>
<rect class="f" x="50" y="50" width="40" height="40"/><text x="62" y="105">2</text>
<rect class="f" x="110" y="30" width="60" height="60"/><text x="135" y="105">3</text>
<rect class="f" x="190" y="10" width="80" height="80"/><text x="225" y="105">4</text></svg>`;
const BACT=`<svg class="fig" viewBox="0 0 320 120" width="320"><rect class="o" x="10" y="25" width="130" height="60" rx="30"/><path class="o" d="M40 55 q15 -15 30 0 t30 0" stroke-dasharray="3 2"/>
<text x="20" y="108">bacterium: DNA loose, NO nucleus</text><ellipse class="o" cx="245" cy="55" rx="65" ry="42"/><circle class="o" cx="245" cy="55" r="15"/><text x="232" y="59">nuc</text>
<text x="190" y="112">animal cell: nucleus</text></svg>`;
QuestEngine.start({game:'microbe-mission',defaultPlayer:'Mateo',emoji:'🦠',unit:'samples',confBonus:true,hintCost:1,studyCard:true,tutorLabel:'Andrew',
title:'Station Tycho: Microbe Mission',
story:'Alert, Science Officer! Station Tycho\'s quarantine lab just received mystery microbes from a returning probe. Before anything leaves the lab, you need to run the zoom scope correctly, figure out why cells are so tiny, and identify which samples are bacteria. One sample at a time. This mission has a twist: before some checks, you will <b>predict first, then test</b>. Real scientists are happy when a test proves them wrong, because that\'s when they learn something.',
strategy:`<p><b>⭐ Call your result</b> before every check. 😎 Sure + right → +5. 😬 Guessing + not yet → +3 honesty bonus.</p>
<p><b>🎯 What “sure” should mean:</b> pick 😎 only if you can (1) explain <i>why</i> in one sentence AND (2) check it a second way. If you can\'t do both, 🙂 is the honest pick, and honesty earns points too.</p>
<p><b>🔍 Check your own answer</b> (your favorite strategy last time!): ask “Does this make sense?” Try a different method, plug the answer back in, or compare with an easy example. Each good self-check = +3 ⭐.</p>
<p><b>💡 Hints cost 1–3 ⭐.</b> Try first. After a miss, the hint is free.</p>
<p>At the end you\'ll write your own <b>study card</b>: 1–2 things future-you needs to remember.</p>`,
hubTitle:'🧪 Choose a lab bay',hubHint:'One bay at a time. Clear all four to release the samples.',
studyQ:'Write 1–2 takeaways in your own words: a fact plus WHY it is true.',studyTip:'Example: “Lenses multiply: 10× then 40× makes 400×, because the second lens enlarges an image that is already 10× bigger.”',
paths:[
{id:'zoom',emoji:'🔭',name:'Zoom Scope Bay',desc:'Total magnification: how lenses team up, a rookie\'s mistake, and working backwards.',doneMsg:'Zoom scope certified! 🔭',
strategy:`<p><b>Zoom Scope Protocol</b></p><ul>
<li>The <b>eyepiece</b> and the <b>objective lens</b> work as a relay. The objective makes the sample bigger, then the eyepiece makes <i>that</i> image bigger again.</li>
<li>So lenses <b>multiply</b>: <b>total magnification = eyepiece × objective</b>.</li>
<li>Example: 10× eyepiece, 10× objective → 10 × 10 = <b>100×</b>, not 20×.</li>
<li>🔍 <b>Check:</b> adding is almost always too small. If your total is smaller than eyepiece × objective, you probably added.</li></ul>`,
items:[
NUM({id:'z1',skill:'magnification-calc',label:'Sample 1',hintCost:1,q:'The scope has a 10× eyepiece and you click in the 4× objective. What is the total magnification? (just the number)',a:'40',h:'Total magnification = eyepiece × objective.',s:'10 × 4 = 40 → 40× total magnification.',
 selfCheck:{q:'How could you double-check 40×?',opts:['Add them: 10 + 4 = 14, so the answer 40 is wrong','Picture it: a 4× image, made 10× bigger again','Only the eyepiece really matters, so it must be 10×','The bigger lens wins, so the total should be 10×'],a:1,why:'The objective makes it 4× bigger, then the eyepiece makes THAT image 10× bigger: 4 × 10 = 40 ✓.'}}),
MC({id:'z2',skill:'magnification-mistake',label:'Sample 2 · Rookie log',hintCost:1,q:'Rookie Cadet Lee wrote: “10× eyepiece + 40× objective = 50× total.” What should the log say?',opts:['50×, because you add the two lens numbers','40×, because only the objective lens counts','400×, because lens powers multiply: 10 × 40','4×, because you divide the objective by the eyepiece'],a:2,h:'Do lenses add or multiply? Look at the protocol card (📇).',s:'Lee added. Lenses multiply: 10 × 40 = 400×. The 40× lens makes the sample 40 times bigger, then the 10× eyepiece makes that 10 times bigger again.'}),
NUM({id:'z3',skill:'magnification-calc',label:'Sample 3',hintCost:1,q:'A newer scope has a 15× eyepiece. With the 10× objective, what is the total magnification?',a:'150',h:'Multiply eyepiece × objective. Multiplying by 10 adds a zero.',s:'15 × 10 = 150 → 150×.',
 selfCheck:{q:'Which check fits 150× best?',opts:['15 + 10 = 25, so the answer should be 25','10 × 15: add a zero to 15 and get 150 ✓','150 ÷ 10 = 10, so it checks out fine','Bigger numbers are always right in science'],a:1,why:'Same multiplication in the other order: 10 × 15 = 150 ✓. (150 ÷ 10 is 15, not 10.)'}}),
NUM({id:'z4',skill:'magnification-reverse',label:'Sample 4 · Work backwards',hintCost:2,q:'Your screen says TOTAL 1000× and the eyepiece is 10×. What power is the objective lens? (just the number)',a:'100',h:'10 × ? = 1000. Undo the multiplying by dividing.',s:'1000 ÷ 10 = 100, so the objective is 100×.\nCheck: 10 × 100 = 1000 ✓'}),
MC({id:'z5',skill:'magnification-compare',label:'Sample 5 · TAG',hintCost:3,q:'With a 10× eyepiece, you switch from the 10× objective to the 40× objective. How many times bigger does the microbe look now?',opts:['30 times bigger, because 40 − 10 = 30','4 times bigger, because it goes 100× to 400×','40 times bigger, the same as the new lens power','10 times bigger, because the eyepiece is 10×'],a:1,h:'Find the total magnification before and after. Then compare.',s:'Before: 10 × 10 = 100×. After: 10 × 40 = 400×. 400 ÷ 100 = 4, so it looks 4 times bigger.'})]},
{id:'cube',emoji:'🧊',name:'Cube Lab: Why Cells Are Tiny',desc:'Predict, then test: what happens to surface area ÷ volume as a cell grows?',doneMsg:'Cube Lab complete! You tested your prediction like a real scientist. 🧊',
strategy:`<p><b>Cube Lab Protocol</b></p>${CUBES}<ul>
<li>Pretend each cell is a cube with side <b>s</b>.</li>
<li><b>Surface area (SA)</b> = 6 faces × (s × s). This is the cell\'s “doorway” where food and oxygen get in and waste gets out.</li>
<li><b>Volume (V)</b> = s × s × s. This is all the stuff inside that needs supplies.</li>
<li><b>SA ÷ V</b> = how much doorway each bit of inside gets. Bigger number = easier delivery.</li></ul>
<table class="sa"><tr><th>side</th><th>SA</th><th>V</th><th>SA ÷ V</th></tr><tr><td>1</td><td>?</td><td>?</td><td>?</td></tr><tr><td>2</td><td>?</td><td>?</td><td>?</td></tr><tr><td>3</td><td>?</td><td>?</td><td>?</td></tr><tr><td>4</td><td>?</td><td>?</td><td>?</td></tr></table>
<p>🎯 <b>Predict first:</b> commit to a prediction, then test it. Being wrong in a prediction is NOT failing. It\'s the moment you learn.</p>`,
items:[
MC({id:'c0',skill:'sav-predict',label:'Prediction',hintCost:1,q:'🎯 PREDICT before you calculate: as a cube-shaped cell gets bigger, what happens to its SA ÷ V (surface per unit of inside)?',opts:['It gets bigger, since big cells have more surface','It gets smaller, since the inside grows faster','It stays the same, since every cube has six faces','It can go either way, depending on the cell'],a:1,h:'This is a prediction, so think, pick, and rate your confidence honestly. The next samples will test it.',s:'It gets SMALLER. The surface grows (side × side) but the inside grows faster (side × side × side). Now let\'s TEST it with real numbers, so you don\'t have to take my word for it.'}),
STEPS({id:'c1',skill:'surface-area-volume',label:'Test 1 · side = 1',hintCost:1,q:'Cube cell with side 1. Work it out one move at a time.',h:'SA = 6 × s × s. V = s × s × s.',s:'SA = 6 × 1 × 1 = 6\nV = 1 × 1 × 1 = 1\nSA ÷ V = 6 ÷ 1 = 6',steps:[
MOVE('SA = 6 × 1 × 1',['1','4','6','12'],2,'SA = 6','6 faces, each 1 × 1.','What is the surface area?'),
MOVE('V = 1 × 1 × 1',['1','3','6','0'],0,'V = 1','1 × 1 × 1 = 1.','What is the volume?'),
MOVE('SA ÷ V = 6 ÷ 1',['1','6','7','5'],1,'SA ÷ V = 6','6 units of surface for every 1 unit of inside.','What is SA ÷ V?')]}),
STEPS({id:'c2',skill:'surface-area-volume',label:'Test 2 · side = 2',hintCost:1,q:'Now a cube cell with side 2.',h:'Each face is 2 × 2 = 4. There are 6 faces.',s:'SA = 6 × 2 × 2 = 24\nV = 2 × 2 × 2 = 8\nSA ÷ V = 24 ÷ 8 = 3',steps:[
MOVE('SA = 6 × 2 × 2',['12','16','24','36'],2,'SA = 24','Each face is 4, and 6 × 4 = 24.','What is the surface area?'),
MOVE('V = 2 × 2 × 2',['6','8','4','12'],1,'V = 8','2 × 2 × 2 = 8 little cubes inside.','What is the volume?'),
MOVE('SA ÷ V = 24 ÷ 8',['3','6','16','4'],0,'SA ÷ V = 3','24 ÷ 8 = 3. It went from 6 down to 3!','What is SA ÷ V?')]}),
NUM({id:'c3',skill:'surface-area-volume',label:'Test 3 · side = 3',hintCost:2,q:'Cube cell with side 3. Find SA (6 × 3 × 3) and V (3 × 3 × 3), then type SA ÷ V.',a:'2',ph:'e.g. 2.5',h:'SA = 6 × 9 = 54. V = 27. Now divide 54 ÷ 27.',s:'SA = 6 × 9 = 54\nV = 27\n54 ÷ 27 = 2',
 selfCheck:{q:'Check: does 2 fit the pattern so far (6, then 3, then ?)?',opts:['No, by now it should start going back up','Yes, it shrinks as the cube grows','No, it should be 6 again for every cube','Yes, but only because 3 is an odd number'],a:1,why:'6 → 3 → 2: each bigger cube has less surface per bit of inside. That matches the pattern ✓.'}}),
NUM({id:'c4',skill:'surface-area-volume',label:'Test 4 · side = 4',hintCost:2,q:'Last one: cube cell with side 4. What is SA ÷ V?',a:'1.5',ph:'e.g. 2.5',h:'SA = 6 × 16 = 96. V = 64. Then divide 96 ÷ 64.',s:'SA = 6 × 16 = 96\nV = 64\n96 ÷ 64 = 1.5\nFull table: 6 → 3 → 2 → 1.5'}),
MC({id:'c5',skill:'sav-pattern',label:'Test result',hintCost:1,q:'🔬 TEST RESULT. Your table says SA ÷ V went 6 → 3 → 2 → 1.5 as the side went 1 → 2 → 3 → 4. Compare with your prediction. What does the data show?',opts:['Bigger cubes have more surface per bit of inside','Bigger cubes have less surface per bit of inside','All cubes have the same surface per bit of inside','There is no pattern in the numbers in this table'],a:1,h:'Read the SA ÷ V numbers from left to right. Going up or down?',s:'The ratio SHRINKS. Bigger cube → less surface for each bit of inside. If your prediction said “bigger,” the data just changed your mind, which is exactly what tests are for.',
 selfCheck:{q:'A scientist\'s prediction is proven wrong by a test. What should she do?',opts:['Hide the test and keep the prediction','Update her idea to match the evidence','Run the test until she gets her answer','Decide the test numbers must be broken'],a:1,why:'Evidence wins. Changing your mind when the data says so is a scientist\'s superpower.'}}),
MC({id:'c6',skill:'why-cells-small',label:'Sample 6',hintCost:2,q:'Use your table. Why do cells stay so small?',opts:['Small cells are lighter, so they float more easily','Small cells need less DNA to stay in control','Supplies can move in and out fast enough','Small cells are easier for scientists to see'],a:2,h:'Food and oxygen come in through the surface. Who needs them? All of the inside.',s:'Materials move in and out through the surface. A small cell has lots of surface for its inside, so food, oxygen and waste can move in and out fast enough to keep every part alive.'}),
MC({id:'c7',skill:'why-cells-small',label:'Sample 7 · TAG',hintCost:3,q:'Imagine a giant cell the size of a basketball. What would go wrong first?',opts:['Its surface would be much too big for all its inside','The middle couldn\'t get food and oxygen fast enough','It would have too many doorways for its supplies','It would instantly split into two smaller cells'],a:1,h:'Think about SA ÷ V for a huge cube. Lots of inside, not much doorway.',s:'A huge cell has a tiny SA ÷ V. Supplies coming through the membrane can\'t reach the middle fast enough, and waste piles up. That\'s why big living things are made of MANY small cells instead of one giant one.'})]},
{id:'microbe',emoji:'🦠',name:'Microbe ID Bay',desc:'Bacteria = cells with no nucleus, plus plant-only parts and one cell vs many.',doneMsg:'Microbes identified! 🦠',
strategy:`<p><b>Microbe ID Protocol</b></p>${BACT}<ul>
<li><b>Bacteria are cells with NO nucleus.</b> Their DNA floats loose in the cytoplasm. Cells like this are called <b>prokaryotes</b>.</li>
<li>Plant cells, animal cells, and amoebas DO have a nucleus (<b>eukaryotes</b>).</li>
<li>So “every cell has a nucleus” is a myth. Every cell has a <b>membrane, cytoplasm and DNA</b>, but not always a nucleus.</li>
<li><b>Plant only:</b> cell wall, chloroplasts, large central vacuole.</li>
<li><b>Unicellular</b> = one cell. <b>Multicellular</b> = many cells. Count cells, not size: some tiny animals are made of thousands of cells.</li></ul>`,
items:[
MC({id:'p1',skill:'prokaryote-no-nucleus',label:'Sample 8',hintCost:1,q:'Probe sample B-7 has a membrane, cytoplasm, and DNA floating loose. It has NO nucleus. What is it most likely?',opts:['A dead animal cell','A bacterium cell','A tiny plant cell','Not a cell at all'],a:1,h:'Which kind of cell keeps its DNA loose instead of inside a nucleus? Look at the protocol card.',s:'Bacteria are cells with no nucleus. Their DNA floats in the cytoplasm. It is still a living cell!',
 selfCheck:{q:'How could you check your answer?',opts:['Look for membrane, cytoplasm, DNA: all cells have them','See if it is green, since only bacteria are green inside','Measure it, since anything this tiny must be a bacterium','Check for a nucleus, since every living cell needs one'],a:0,why:'Membrane + cytoplasm + DNA = a cell. No nucleus = a bacterium (prokaryote).'}}),
MC({id:'p2',skill:'prokaryote-no-nucleus',label:'Sample 9 · Myth check',hintCost:2,q:'Which statement is TRUE?',opts:['Every living cell has a nucleus inside it','Bacteria are too small to be made of cells','Some cells, like bacteria, lack a nucleus','Only plant and animal cells contain DNA'],a:2,h:'Remember sample B-7.',s:'Bacteria are cells, but they have no nucleus. Their DNA is loose in the cytoplasm. Plant and animal cells have both DNA and a nucleus.'}),
STEPS({id:'p3',skill:'nucleus-sort',label:'Sample 10 · Sort',hintCost:2,q:'Sort each sample: does it have a nucleus?',h:'Only the bacteria are missing a nucleus.',s:'No nucleus: bacterium, E. coli\nHas a nucleus: astronaut skin cell, spinach leaf cell, amoeba',steps:[
MOVE('Bacterium from the probe',NUC,1,'no nucleus','Bacteria are prokaryotes: DNA loose, no nucleus.','Nucleus or not?'),
MOVE('Astronaut skin cell',NUC,0,'has a nucleus','Animal cells keep DNA in a nucleus.','Nucleus or not?'),
MOVE('Spinach leaf cell',NUC,0,'has a nucleus','Plant cells have a nucleus too.','Nucleus or not?'),
MOVE('Amoeba (one-celled pond critter)',NUC,0,'has a nucleus','Tricky! An amoeba is one cell, but it DOES have a nucleus. Unicellular does not mean bacterium.','Nucleus or not?'),
MOVE('E. coli (a gut bacterium)',NUC,1,'no nucleus','E. coli is a bacterium, so no nucleus.','Nucleus or not?')]}),
MC({id:'p4',skill:'plant-only-structure',label:'Sample 11',hintCost:1,q:'You compare a spinach cell from the station greenhouse with an astronaut\'s cheek cell. Which part would you find ONLY in the spinach cell?',opts:['Chloroplasts','Cell membrane','Mitochondria','Nucleus'],a:0,h:'Which part does photosynthesis?',s:'Chloroplasts capture light to make sugar. Only plant cells (and some algae) have them. Both cells have a membrane, mitochondria and a nucleus.'}),
MC({id:'p5',skill:'unicellular-multicellular',label:'Sample 12',hintCost:2,q:'A tardigrade (“water bear”) is only about half a millimeter long, but its body is made of about 1,000 cells. Is it unicellular or multicellular?',opts:['Unicellular, since it is so very tiny','Multicellular, since it has many cells','Unicellular, since it lives in water','Neither one, since it is not really alive'],a:1,h:'Uni = one. Multi = many. Count, don\'t measure.',s:'About 1,000 cells = multicellular. Tiny size doesn\'t make something unicellular; the number of cells does.',
 selfCheck:{q:'What is the best way to check uni- vs multicellular?',opts:['Measure how long its body is','Count how many cells it has','See if it lives in water','Look for a green color inside'],a:1,why:'It\'s all about the NUMBER of cells: one = unicellular, many = multicellular.'}}),
MC({id:'p6',skill:'unicellular-multicellular',label:'Sample 13',hintCost:1,q:'Each bacterium in sample B-7 is one single cell that eats, grows and divides on its own. So bacteria are…',opts:['Multicellular','Unicellular','Organs','Tissues'],a:1,h:'How many cells is one bacterium?',s:'One cell doing every job = unicellular.'})]},
{id:'log',emoji:'📡',name:'Mission Log Reading',title:'Mission Log: Survivors on the Outside',desc:'Read a short space-science log. Find the main idea and the most specific evidence.',doneMsg:'Mission log decoded! 📡',
strategy:`<p><b>Reading Protocol</b></p><ul>
<li><b>Main idea</b> = what the WHOLE passage is mostly about, not just one detail.</li>
<li><b>Specific evidence</b> = the sentence that proves the claim directly, often with an exact detail (a number, a cause, a result).</li>
<li>Watch for <b>“might,” “some scientists think”</b>: that\'s an idea, not a proven fact.</li>
<li>🔍 <b>Check:</b> read your sentence next to the claim. Does it prove it all by itself?</li></ul>`,
passage:['In 2015, scientists on the International Space Station began a bold experiment called Tanpopo.','Astronauts attached small panels to the outside of the station, holding dried clumps of a very tough bacterium named <i>Deinococcus</i>.','Out there, the bacteria faced freezing cold, no air, and powerful ultraviolet light from the Sun.','After three years, the panels returned to Earth, and scientists added water to see if anything had survived.','In the thinnest clumps, the cells did not survive.','But in clumps thicker than about half a millimeter, cells in the middle came back to life.','The dead cells on the outside of each clump had acted like a shield, blocking ultraviolet light from the cells inside.','Some scientists now think tiny living things might survive a trip between planets if they were protected inside a clump or a rock.'],
items:[
MC({id:'r1',skill:'main-idea',label:'Log 1',hintCost:1,q:'What is the main idea of the mission log?',opts:['Astronauts spend years fixing broken panels outside the space station','Thick clumps of bacteria survived because outer cells shielded inner ones','Scientists have now proved that bacteria traveled between planets on rocks','Ultraviolet light from the Sun helps bacteria grow quickly in space'],a:1,h:'Which choice covers the whole passage, from the experiment to the result? Watch out for “proved.”',s:'The log is mostly about bacteria surviving three years in space thanks to a shield of outer cells. Choice C goes too far: the last sentence says scientists think it MIGHT happen, not that they proved it.'}),
TAP({id:'r2',skill:'specific-evidence',label:'Log 2',hintCost:2,q:'Claim: “The thickness of a clump mattered.” Tap the sentence that gives the most specific evidence.',a:5,h:'Look for a sentence with an exact size and a result.',s:'S6: clumps thicker than about half a millimeter had survivors. It gives an exact detail (½ mm) and the result (cells came back to life).',
 selfCheck:{q:'Self-check your evidence. What test should it pass?',opts:['It is the longest sentence in the log','It is the very first sentence of the log','It proves the claim with an exact detail','It uses the most exciting space words'],a:2,why:'Strong evidence proves the claim directly. Here: a size (½ mm) linked to a result (survival).'}}),
TAP({id:'r3',skill:'specific-evidence',label:'Log 3',hintCost:2,q:'Tap the sentence that explains HOW the cells in the middle survived.',a:6,h:'Find the cause: what protected the inner cells?',s:'S7: the dead outer cells acted like a shield and blocked the ultraviolet light. That explains HOW the inner cells survived.'})]}],
reflectChips:['Predict, then test','Checking my own answer','Using the protocol card','Lenses multiply','SA ÷ V table','Counting cells'],
reflectQ:'Which strategy helped you most today, and why?',
winMsg:'Mission complete! Station Tycho salutes you, Science Officer! 🛰️<span class="handson">🍬 <b>Optional kitchen lab (5 min, with a parent):</b> build one sugar cube by itself and a 2 × 2 × 2 block of 8 cubes. Count the faces you can see on the outside: 6 for the single cube, 24 for the big block. The big block has 8 times the inside but only 4 times the outside, so SA ÷ V drops from 6 to 3. Bonus: drop each into warm water and watch which dissolves faster. More outside per inside = faster!</span>'});
</script></body></html>
